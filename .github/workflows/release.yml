name: Release

# Pushing a branch named "release/X.Y.Z" (for instance release/0.2.0)
# publishes that version:
#   1. tests on Windows, macOS and Linux;
#   2. build of every file (tools/release/package.sh);
#   3. Windows installer (Inno Setup) and macOS disk images, on their systems;
#   4. tag vX.Y.Z and GitHub release with every file and checksums.txt.
on:
  push:
    branches: ['release/*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Version from the branch name
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The branch must be named release/MAJOR.MINOR.PATCH (for instance release/0.2.0), not $GITHUB_REF_NAME"
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Version $version is already released"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  package:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Tools for the Windows icons
        run: |
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build every file
        env:
          # application key for OpenSubtitles.com (Settings › Secrets › Actions)
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: tools/release/package.sh "${{ needs.version.outputs.version }}" "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows-setup:
    needs: [version, package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$PWD\dist\windows-installer" `
            "/DRepoURL=https://github.com/$env:GITHUB_REPOSITORY" "/O$PWD\setup" packaging\windows\cinearr.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: setup/*.exe

  macos-dmg:
    needs: [version, package]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sign (ad hoc) and build the disk images
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dmg
          for pair in arm64:apple-silicon amd64:intel; do
            arch="${pair%%:*}"; label="${pair##*:}"
            stage="stage-$arch"
            mkdir -p "$stage"
            tar -xf "dist/macos-$arch.app.tar" -C "$stage"
            codesign --force --deep --sign - "$stage/Cinearr.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Cinearr $v" -srcfolder "$stage" -ov -format UDZO "dmg/Cinearr-$v-macos-$label.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dmg/*.dmg

  publish:
    needs: [version, windows-setup, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p out
          cp artifacts/setup/*.exe artifacts/dmg/*.dmg out/
          cp artifacts/dist/Cinearr-*-windows-*-portable.zip artifacts/dist/Cinearr-*-linux-*.tar.gz out/
          (cd out && sha256sum * > checksums.txt)
          ls -la out
          # the entry "## [X.Y.Z]" of CHANGELOG.md, when there is one
          awk -v v="$v" '/^## \[/{on = index($0, "[" v "]") > 0; next} on' CHANGELOG.md > notes.md
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.version.outputs.version }}"
          notes=(--generate-notes)
          if [ -s notes.md ]; then notes=(--notes-file notes.md); fi
          gh release create "v$v" out/* --target "$GITHUB_SHA" --title "Cinearr $v" "${notes[@]}"
