name: Release

# Pushing a branch named "release/X.Y.Z" (for instance release/0.1.0)
# publishes that version: tests on Windows, macOS and Linux, then tag
# v0.1.0, build of the six targets and GitHub release with the archives.
on:
  push:
    branches: ['release/*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Version from the branch name
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The branch must be named release/MAJOR.MINOR.PATCH (for instance release/0.1.0), not $GITHUB_REF_NAME"
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Version $version is already released"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Cinearr $version"
          git push origin "v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        # the entry "## [X.Y.Z]" of the changelog when there is one
        run: |
          awk -v v="$VERSION" '/^## \[/{on = index($0, "[" v "]") > 0; next} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "NOTES=--release-notes $RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean ${{ env.NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # application key for OpenSubtitles.com (Settings › Secrets › Actions)
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}