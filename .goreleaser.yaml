version: 2
project_name: cinearr
before:
  hooks:
    - go test ./...
builds:
  - id: desktop
    main: ./cmd/cinearr
    binary: cinearr
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X cinearr/internal/api.Version={{.Version}}
      - -X cinearr/internal/subtitles.BuiltinOpenSubtitlesKey={{ envOrDefault "OPENSUBTITLES_API_KEY" "" }}
      - '{{ if eq .Os "windows" }}-H=windowsgui{{ end }}'
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, CREDITS.md, CHANGELOG.md, docs/guide.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
